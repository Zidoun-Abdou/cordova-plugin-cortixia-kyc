// Applied into the Cordova Android app build. Keeps the plugin's Android
// requirements in one place so the host app (and OutSystems) needs no edits.
android {
    // NFC + the eMRTD stack need 26+.
    defaultConfig {
        minSdkVersion 26
    }
    // ML Kit + CameraX ship Java 8 bytecode features.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // The plugin's own keep rules (see cortixia-kyc-proguard.pro), installed
    // by plugin.xml under app/src/main/. Appending to every build type is a
    // no-op unless the host enables minification. AGP silently ignores a
    // missing proguard file — which strips the reflectively-loaded plugin
    // class and only fails at runtime — so a wrong path must fail the build.
    def cortixiaRules = file('src/main/cortixia-kyc-proguard.pro')
    if (!cortixiaRules.exists()) {
        throw new GradleException(
            'cortixia-kyc-proguard.pro not found at ' + cortixiaRules +
            ' — run `cordova prepare android` (the plugin installs it).')
    }
    buildTypes.all {
        proguardFiles cortixiaRules
    }
    // jMRTD's BouncyCastle jars (bcprov/bcutil) ship the same OSGI/module
    // metadata, which the APK resource merger rejects as duplicates. These are
    // build-time only — dropping them from the package is safe.
    packagingOptions {
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/LICENSE*'
        exclude 'META-INF/NOTICE*'
    }
}

dependencies {
    // The guided scanning screens are AppCompat Activities.
    implementation "androidx.appcompat:appcompat:1.6.1"
    // MRZ optical character recognition.
    implementation "com.google.mlkit:text-recognition:16.0.0"
    // Camera preview + frame analysis (MRZ) and video capture (liveness).
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-video:$camerax"

    // eMRTD chip read (BAC + secure messaging, DG2/DG7/DG11/DG12).
    // jMRTD is LGPL (AAR/dynamic-link use is fine). scuba-sc-android is the
    // Android-flavoured smartcard I/O layer; exclude jMRTD's desktop
    // scuba-smartcards (pulls javax.smartcardio, absent on Android) so only the
    // Android impl of net.sf.scuba.smartcards.* is on the classpath.
    implementation("org.jmrtd:jmrtd:0.7.42") {
        exclude group: "net.sf.scuba", module: "scuba-smartcards"
    }
    implementation "net.sf.scuba:scuba-sc-android:0.0.23"
    // jMRTD 0.7.42 pulls bcprov-jdk18on transitively (its BAC/SM crypto). We
    // register the full provider at runtime (NfcReadActivity), replacing
    // Android's stripped "BC" stub, so DES/3DES for BAC is available.
}
